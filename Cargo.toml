[package]
name = "kt-format"
edition.workspace = true
version.workspace = true

[workspace]
members = ["core", "proc/anyhow", "proc/log", "proc/std", "proc/tracing"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
log = "0"
paste = "1.0.15"
proc-macro2 = "1.0.107"
quote = "1.0.47"
regex = "1.13.1"
syn = "3.0.6"
tracing = "0"

[features]
default = ["std"]
std = ["dep:kt-std"]
anyhow = ["dep:kt-anyhow", "dep:anyhow"]
log = ["dep:kt-log", "dep:log"]
tracing = ["dep:kt-tracing", "dep:tracing"]
full = ["default", "anyhow", "log", "tracing"]

[dependencies]
anyhow = { workspace = true, optional = true }
kt-anyhow = { path = "proc/anyhow", optional = true }
kt-log = { path = "proc/log", optional = true }
kt-std = { path = "proc/std", optional = true }
kt-tracing = { path = "proc/tracing", optional = true }
log = { workspace = true, optional = true }
paste.workspace = true
tracing = { workspace = true, optional = true }
